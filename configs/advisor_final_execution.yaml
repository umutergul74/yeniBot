protocol: advisor_final_execution_v1
reservation_config: configs/advisor_final_test.yaml
stage_config: configs/advisor_stages.yaml
development_root: output/advisor_experiments
output: output/advisor_experiments/final_test_v1
raw:
  base_snapshot: output/advisor_experiments/inputs/market_snapshot_v1
  history_start: '2022-01-01T00:00:00Z'
  zero_activity_policy: preserve_verified_empty
selected_method:
  architecture: gru
  wavelet: false
  loss: bce
  features: [log_return, volume_log_zscore, realized_vol_14, gk_vol_14, atr_14_pct, vwap_dist_atr]
  comparator_models: []
  # Only the validation-selected method + simple baselines in this final protocol.
fit:
  train_start: '2025-12-18T00:00:00Z'
  train_end: '2026-07-15T23:00:00Z'
  purge_bars: 24
  validation_start: '2026-07-17T00:00:00Z'
  validation_end: '2026-08-30T23:00:00Z'
  train_bars: 5040
  validation_bars: 1080
  refit_on_train_plus_validation: false
  fold_seed_offset: 0
model:
  seq_len: 64
  tcn_channels: 64
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4, 8, 16]
  gru_hidden: 128
  gru_layers: 2
  dropout: 0.2
  fusion_hidden: 128
training:
  seeds: [42, 43, 44]
  epochs: 100
  patience: 15
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  selection_metric: validation_bce
  threshold: 0.5
  loss: bce
  torch_threads: 4
  deterministic: true
labeling:
  max_holding_bars: 10
  tp_multiplier: 2.0
  sl_multiplier: 5.0
