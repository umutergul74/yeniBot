# Protocol v1: development only. No final-test evaluation in this command.
protocol: advisor_ablation_v1
development:
  start: '2022-03-01T04:00:00Z'
  end: '2025-12-28T02:00:00Z'
  historical_data_seen: true
  final_test_status: not_defined_not_evaluated
data:
  snapshot: data/raw/snapshots/20260830_integrity_v2
  frame: output/advisor_experiments/data/development_wavelet_off.parquet
  feature_config: config.yaml
  wavelet: false
  feature_columns_file: configs/advisor_full_features.txt
  basic_features: [log_return, volume_log_zscore, realized_vol_14, gk_vol_14, atr_14_pct, vwap_dist_atr]
labeling:
  max_holding_bars: 10
  tp_multiplier: 2.0
  sl_multiplier: 5.0
walk_forward:
  train_bars: 5040
  val_bars: 1080
  test_bars: 720
  step_bars: 720
  purge_bars: 24
  embargo_bars: 24
model:
  seq_len: 64
  tcn_channels: 64
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4, 8, 16]
  gru_hidden: 128
  gru_layers: 2
  dropout: 0.2
  fusion_hidden: 128
training:
  seeds: [42, 43, 44]
  epochs: 100
  patience: 15
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  selection_metric: validation_bce
  threshold: 0.5
  loss: bce
  torch_threads: 4
  deterministic: true
experiments:
  A: {features: basic, architecture: gru}
  B: {features: full, architecture: gru}
  C: {features: full, architecture: tcn}
  D: {features: full, architecture: tcn_gru}
output: output/advisor_experiments/runs
