name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/locks/linux-py313.txt

      - name: Install dependencies
        run: |
          python scripts/prepare_environment.py --directory .venv-ci --report reports/environment-smoke.json
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Run static, repository and CPU contract checks
        run: python scripts/quality.py quick

      - name: Audit installed project dependencies
        run: |
          python scripts/environment_snapshot.py --audit > /tmp/yenibot-dependencies.txt
          python -m venv /tmp/yenibot-audit
          /tmp/yenibot-audit/bin/python -m pip install pip-audit==2.10.0
          /tmp/yenibot-audit/bin/python -m pip_audit --no-deps --disable-pip -r /tmp/yenibot-dependencies.txt

  full-experiment-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/locks/linux-py313.txt

      - name: Install dependencies
        run: |
          python scripts/prepare_environment.py --directory .venv-ci --report reports/environment-smoke.json
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Run full experiment integration suite
        run: python scripts/quality.py full
